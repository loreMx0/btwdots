plugin {
    hyprbars {
        bar_height = 28
        bar_color = rgba(00000000)
        bar_part_of_window = true
        bar_precedence_over_border = true
        bar_text_size = 11
        bar_text_font = "JetBrainsMono Nerd Font"
        bar_button_padding = 8
        bar_padding = 8

        hyprbars-button = rgb(f38ba8), 14, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(e8c9a8), 14, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgb(a8b89a), 14, 󰖰, hyprctl dispatch movetoworkspacesilent special:minimized
    }
}
